name: Terminal release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked build dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --extra dev --extra desktop --extra build
      - name: Validate version and immutable release
        run: |
          uv run python -c "import os; from scrip_core import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__, 'Tag/version mismatch'"
          if ($LASTEXITCODE -ne 0) { throw 'Version validation failed' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release exists. Use a new version; never overwrite artifacts.' }
          $global:LASTEXITCODE = 0
      - name: Prepare publisher-signed installer compiler
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'scrip-inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Compiler signature validation failed' }
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$compiler") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          "SCRIP_ISCC=$compiler/ISCC.exe" >> $env:GITHUB_ENV
      - name: Build and smoke-test native application
        run: uv run python -m devtools.build_terminal --compiler "$env:SCRIP_ISCC"
      - name: Verify setup install, reinstall, and removal on the disposable runner
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $setup = (Resolve-Path "dist/installers/Scrip-Terminal-$version-windows-x64-setup.exe").Path
          $installPath = Join-Path $env:RUNNER_TEMP 'scrip-installer-check'
          $registration = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{09C01260-7E81-4BC2-BB3C-F215D4405581}_is1'
          if ((Test-Path -LiteralPath $registration) -or (Test-Path -LiteralPath $installPath)) { throw 'Installer check requires an unused runner and isolated paths' }
          $originalUserPath = @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -ne '' }) -join ';'
          $uninstaller = Join-Path $installPath 'unins000.exe'
          try {
            1..2 | ForEach-Object {
              $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', '/TASKS=terminalpath', "/DIR=`"$installPath`"") -WindowStyle Hidden -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw 'Setup installation failed' }
            }
            if ((Get-ItemProperty -LiteralPath $registration).DisplayVersion -ne $version) { throw 'Installed version mismatch' }
            $userPaths = @(([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') | Where-Object { $_.TrimEnd('\') -ieq $installPath.TrimEnd('\') })
            if ($userPaths.Count -ne 1) { throw 'Setup must add exactly one user PATH entry across reinstalls' }
            uv run python -c "import sys; from pathlib import Path; from devtools.native_project import check; check(Path(sys.argv[1]))" "$installPath/scrip.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Installed command lifecycle check failed' }
          } finally {
            if (Test-Path -LiteralPath $uninstaller) {
              $process = Start-Process $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw 'Setup removal failed' }
            }
          }
          if (Test-Path -LiteralPath $registration) { throw 'Uninstall left an installer registration' }
          if (Test-Path -LiteralPath (Join-Path $installPath 'scrip.exe')) { throw 'Uninstall left the application executable' }
          $restoredUserPath = @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -ne '' }) -join ';'
          if ($restoredUserPath -ne $originalUserPath) { throw 'Uninstall did not restore the user PATH' }
      - name: Build package and verified public distribution
        run: |
          uv build
          if ($LASTEXITCODE -ne 0) { throw 'Python distribution failed' }
          $version = $env:RELEASE_TAG.Substring(1)
          uv run python -m devtools.release --output dist/release/public --commit $env:GITHUB_SHA --installer "dist/installers/Scrip-Terminal-$version-windows-x64-setup.exe" --tag $env:RELEASE_TAG
      - name: Publish immutable release
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $files = @(Get-ChildItem dist/scrip_companion-*.whl, dist/scrip_companion-*.tar.gz, dist/installers/*.exe, dist/release/scrip-web-*.tar.gz, dist/release/SHA256SUMS | ForEach-Object FullName)
          $options = @('release', 'create', $env:RELEASE_TAG) + $files + @('--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', "Scrip $version", '--notes-file', "docs/releases/$version.md")
          if ($version -match '(a|b|rc)[0-9]+$') { $options += '--prerelease' }
          & gh @options
